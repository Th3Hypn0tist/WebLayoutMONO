<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="title desc">
<title id="title">WebLayoutMONO — Independent by design</title>
<desc id="desc">AIGM architecture graphic: a host application composes five independent libraries WebEngine, WebGUI, WebSVG, S3D, and Style. The libraries have no dependencies between one another.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B111C"/><stop offset="1" stop-color="#111C2C"/></linearGradient>
